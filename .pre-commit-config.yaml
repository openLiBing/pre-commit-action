# pre-commit配置，首次使用需执行以下命令确保生效，可在代码提交前拦截并检查
# pip install pre-commit  # 安装pre-commit工具
# pre-commit install  # 安装git hook，请在代码仓根目录执行
repos:
  # ===================== 通用基础钩子（所有语言） =====================
  #- repo: https://github.com/pre-commit/pre-commit-hooks
  - repo: https://gitcode.com/gh_mirrors/pr/pre-commit-hooks # 使用gitcode镜像加速
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace # 移除行尾空白字符
      - id: end-of-file-fixer # 确保文件以换行符结尾
      - id: check-yaml # 校验 YAML 文件语法
      - id: check-json # 校验 JSON 文件语法
      - id: check-xml # 校验 XML 文件语法
      - id: check-merge-conflict # 检查未解决的合并冲突标记
      - id: check-added-large-files # 拦截超大文件提交（默认500KB）
      #  args: ["--maxkb", "500"]  # 支持自定义修改
      - id: detect-private-key # 检测私钥/敏感信息泄露

  # ===================== 敏感信息扫描 =====================
  #- repo: https://github.com/Yelp/detect-secrets
  - repo: https://gitcode.com/GitHub_Trending/gi/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit # 使用gitcode镜像加速
    rev: v0.15.8
    hooks:
      # 代码格式化：缩进、换行、空格、引号风格、行宽、括号位置、注释对齐、空行规范等
      - id: ruff-format
      # 静态代码分析：未使用变量、未定义变量、死代码、类型错误、导入未排序、PEP8 违规、代码异味、安全漏洞等
      - id: ruff-check
        args: [
            '--fix' # 可选，启用自动修复（如未使用的导入、未使用变量等）
          ]
  - repo: local
    hooks:
      - id: prettier
        name: Prettier Format
        language: system
        entry: sh -c "npm install --no-audit --no-fund >/dev/null 2>&1; npm run format"
        pass_filenames: false
        files: \.(js|ts|vue|jsx|tsx)$

  - repo: local
    hooks:
      - id: eslint
        name: ESLint Check
        language: system
        entry: sh -c "npm install --no-audit --no-fund >/dev/null 2>&1; npm run lint:fix -- --format json --output-file eslint.json"
        pass_filenames: false
        files: \.(js|ts|vue|jsx|tsx)$
