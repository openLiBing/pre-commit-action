name: "pre-commit-action"
version: 1.0.29
author: "test-devops"
description: "安装 pre-commit 并对代码仓库执行钩子检查"

inputs:
  gc_token:
    description: "pre-commit 自动修复时所需密钥"
    required: false
    default: ""
    layout:
      type: "input"
      label: "运行参数"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  extra_args:
    description: "pre-commit 运行参数。为空时自动判断：PR事件检查增量文件，非PR检查全量；填写时按指定参数执行"
    required: false
    default: ""
    layout:
      type: "input"
      label: "运行参数"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  report-dir:
    description: "各工具扫描报告约定目录（机器临时目录，非代码仓目录）。插件读取该目录下 gitleaks JSON 报告，转 SARIF 上传 OBS 并回调 openlibing 后端。PR 类型触发不进行报告上传回调"
    required: false
    default: "/tmp/pre-commit-reports/"
    layout:
      type: "input"
      label: "报告目录"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  env-type:
    description: "回调环境类型：prod（正式环境 apig.openlibing.com）或 beta（测试环境华为云 APIG 实例域名）"
    required: false
    default: "prod"
    layout:
      type: "input"
      label: "回调环境"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  debug:
    description: "开启 SDK 调试定位日志（请求/响应详情，敏感字段自动脱敏）"
    required: false
    default: "false"
    layout:
      type: "input"
      label: "调试模式"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""

outputs:
  result:
    description: "pre-commit 运行结果：success 或 failed"
  checked_files:
    description: "pre-commit 检查的文件范围"

runs:
  using: "node16"
  main: "dist/index.js"
