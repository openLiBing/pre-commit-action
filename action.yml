name: "pre-commit-action"
version: 1.0.33
author: "test-devops"
description: "安装 pre-commit 并对代码仓库执行钩子检查"

inputs:
  extra_args:
    description: "pre-commit 运行参数。为空时使用 --all-files 检查全量文件；填写时按指定参数执行"
    required: false
    default: ""
    layout:
      type: "input"
      label: "运行参数"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""

outputs:
  result:
    description: "pre-commit 运行结果：success 或 failed"
  checked_files:
    description: "pre-commit 检查的文件范围"

runs:
  using: "node16"
  main: "dist/index.js"
