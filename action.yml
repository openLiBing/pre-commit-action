name: "pre-commit-action"
version: 1.0.35
author: "test-devops"
description: "安装 pre-commit 并对代码仓库执行钩子检查"

inputs:
  gc_token:
    description: "pre-commit 增量检查时所需密钥（私有仓库 git fetch 认证用）"
    required: false
    default: ""
    layout:
      type: "input"
      label: "Git 认证 Token"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  extra_args:
    description: "pre-commit 运行参数。为空时使用 --all-files 检查全量文件；填写时按指定参数执行"
    required: false
    default: ""
    layout:
      type: "input"
      label: "运行参数"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  report-dir:
    description: "SARIF 报告约定目录（机器临时目录，非代码仓目录）。SARIF 转换由业务仓负责（detect-secrets/gitleaks JSON 在业务仓 workflow 中转成 *.sarif 写入该目录），插件读取该目录下 *.sarif 上传 OBS 并回调 openlibing 后端。PR 类型触发不进行报告上传回调"
    required: false
    default: "/tmp/pre-commit-reports/"
    layout:
      type: "input"
      label: "报告目录"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  sarif-file:
    description: "SARIF 文件/目录路径，逗号分隔支持多值（与 openlibing-upload-sarif 的 sarif_file 一致）：单个文件、多个文件、单个目录、多个目录（目录自动扫描其中所有 .sarif 文件，非递归）。填写后优先于 report-dir 目录扫描；未填写时回退扫描 report-dir 目录下 *.sarif"
    required: false
    default: ""
    layout:
      type: "input"
      label: "SARIF 文件/目录"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  env-type:
    description: "回调环境类型：prod（正式环境 apig.openlibing.com）或 beta（测试环境华为云 APIG 实例域名）"
    required: false
    default: "prod"
    layout:
      type: "input"
      label: "回调环境"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  debug:
    description: "开启 SDK 调试定位日志（请求/响应详情，敏感字段自动脱敏）"
    required: false
    default: "false"
    layout:
      type: "input"
      label: "调试模式"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""

outputs:
  result:
    description: "pre-commit 运行结果：success 或 failed"
  checked_files:
    description: "pre-commit 检查的文件范围"

runs:
  using: "node16"
  main: "dist/index.js"
