name: openlibing-pre-commit-action

on:
  workflow_dispatch:
    inputs:
      extra_args:
        description: 'pre-commit 运行参数，留空自动判断'
        required: false
        default: '--all-files'
        type: string
  pull_request:
    types: [open, reopen, update]
    branches: ["main"]

stages:
  stage1:
    name: 阶段_1
    select: selected_by_default
    jobs:
      JOB_WJKHX:
        name: pre-commit 检查
        select: selected_by_default
        needs: []
        runs-on: [ 'codearts-hosted', 'ubuntu-latest', x64, 'large']
        steps:

          - name: official_checkout
            uses: official_checkout


          - name: Python version
            run: setup-python
            with:
              version: '3.11.9'

          - name: setup-go
            uses: setup-go
            with:
              version: '1.23.12'

          - name: 运行 pre-commit
            uses: openlibing-pre-commit-action
            with:
              extra_args: ${{ inputs.extra_args }}


    pre:
      - type: auto