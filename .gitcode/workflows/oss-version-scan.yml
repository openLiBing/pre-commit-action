name: oss-version-scan

on:
  workflow_dispatch: ## 开发自测：手动触发，指定扫描分支
    inputs:
      branch:
        description: "扫描分支，默认 master"
        required: false
        default: "master"
      vuln-critical-limit:
        description: "CRITICAL漏洞门禁(>门禁阻断)，默认0"
        required: false
        default: "0"
      vuln-high-limit:
        description: "HIGH漏洞门禁(>门禁阻断)，默认0"
        required: false
        default: "0"
      vuln-medium-limit:
        description: "MEDIUM漏洞门禁(>门禁仅提示不阻断)，默认1000"
        required: false
        default: "1000"
      vuln-low-limit:
        description: "LOW漏洞门禁(>门禁仅提示不阻断)，默认1000"
        required: false
        default: "1000"
      license-critical-limit:
        description: "CRITICAL license门禁(>门禁阻断)，默认50"
        required: false
        default: "50"
      license-high-limit:
        description: "HIGH license门禁(>门禁阻断)，默认50"
        required: false
        default: "50"
      license-medium-limit:
        description: "MEDIUM license门禁(>门禁仅提示不阻断)，默认1000"
        required: false
        default: "1000"
      license-low-limit:
        description: "LOW license门禁(>门禁仅提示不阻断)，默认10000"
        required: false
        default: "10000"
      show-all-vulnerabilities:
        description: "显示全量漏洞（含无修复版本与 MEDIUM/LOW），默认 false；不改变门禁"
        required: false
        default: "false"
      sbom-output:
        description: "开源软件清单输出开关。null=不输出(默认)；list=输出开源软件清单(组件+版本)"
        required: false
        default: "null"
      sbom-output-type:
        description: "开源软件清单输出形式(仅 sbom-output=list 时生效)。table=markdown表格(默认)；code=代码块形式"
        required: false
        default: "table"

permissions:
  repository: read # 本地 trivy 扫描无需写权限，最小授权

jobs:
  oss-version-scan:
    name: 开源漏洞和license扫描
    runs-on: ["self-hosted", "default"]
    steps:
      - name: Checkout repository
        uses: checkout
        with:
          ref: ${{ inputs.branch || 'master' }}

      - name: Run oss-version-scan
        uses: openlibing/trivy-action@v1.4
        with:
          scan-type: version
          vuln-critical-limit: ${{ inputs.vuln-critical-limit || '0' }}
          vuln-high-limit: ${{ inputs.vuln-high-limit || '0' }}
          vuln-medium-limit: ${{ inputs.vuln-medium-limit || '1000' }}
          vuln-low-limit: ${{ inputs.vuln-low-limit || '1000' }}
          license-critical-limit: ${{ inputs.license-critical-limit || '50' }}
          license-high-limit: ${{ inputs.license-high-limit || '50' }}
          license-medium-limit: ${{ inputs.license-medium-limit || '1000' }}
          license-low-limit: ${{ inputs.license-low-limit || '10000' }}
          show-all-vulnerabilities: ${{ inputs.show-all-vulnerabilities || 'false' }}
          sbom-output: ${{ inputs.sbom-output || 'null' }}
          sbom-output-type: ${{ inputs.sbom-output-type || 'table' }}
