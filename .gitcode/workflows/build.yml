name: build

on:
  workflow_dispatch:
  push: # master 分支推送触发构建
    branches:
      - master
  pull_request: # PR 触发构建验证（** 匹配含斜杠的目标分支，如 release/1.x、feature/xxx）
    branches:
      - "**"
  pull_request_comment: # PR 评论 /build 触发构建验证
    types: [created]
    comments: ["/build"]
    branches:
      - "**"

permissions:
  repository: read # checkout 插件最低权限要求

jobs:
  build:
    name: build
    runs-on: ["self-hosted", "default"]
    steps:
      - name: checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.event.pull_request.head.sha }} # PR 场景检出预合并 commit（验证合入默认分支后的最终状态），push/手动场景为空走默认检出

      # npm ci 按 lockfile 精确安装依赖后执行完整构建链（ncc 打包 dist + licenses + zip 附件），验证产物可正常生成；依赖均为公共包，无需私仓凭证
      - name: build
        run: |
          npm ci
          npm run build
